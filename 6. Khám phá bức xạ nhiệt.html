<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#195658">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400&display=swap" rel="stylesheet">
<title>Khoa học tự nhiên 8 – Khám phá bức xạ nhiệt</title>
<style>
:root{--teal:#195658;--teal2:#28756b;--lime:#c7e36e;--ink:#173c3b;--muted:#68817a;--paper:#f4f8f3;--line:#dbe8df;--white:#fff;--deep:#0f3a3a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;min-height:0;overflow:hidden;font-family:Roboto,"Segoe UI",Arial,sans-serif;color:var(--ink);background:#e9f0eb}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #e7ac4f;outline-offset:2px}
[hidden]{display:none!important}

/* ===== HEADER ===== */
header{height:52px;flex:0 0 52px;background:#fff;display:flex;align-items:center;gap:14px;padding:8px 16px;border:1px solid #dce5df;position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;white-space:nowrap}
.brand-logo{height:30px;width:auto;display:block}
.headtext{border-left:1px solid #d7e3db;padding-left:14px;line-height:1.25;min-width:0}
.headtext b{display:block;font-size:12px;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.headtext strong{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.headtools{margin-left:auto;display:flex;gap:8px}
.headtools button{border:1px solid var(--line);border-radius:11px;background:white;color:var(--teal);padding:8px 11px;font-size:12px;font-weight:800;white-space:nowrap}

/* ===== BỐ CỤC ===== */
main{width:100%;height:calc(100dvh - 52px);min-height:0;overflow:hidden;display:flex;flex-direction:column}
.lesson-layout{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;user-select:none}
.viewer{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:#fff;overflow:hidden;position:relative}
.view-content{flex:1 1 auto;min-height:0;position:relative}
.visual{position:absolute;inset:0;overflow:hidden;background:var(--deep)}
@keyframes floatIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.view{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:radial-gradient(ellipse at 50% 30%,#3f8a7e 0%,#245f60 55%,#17474a 100%)}
#sceneA,#sceneB,#sceneC,#sceneD{position:absolute;inset:0}
#sceneA[hidden],#sceneB[hidden],#sceneC[hidden],#sceneD[hidden]{display:none}

/* ===== THANH CÁC BƯỚC ===== */
.rail{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:4px 10px;background:linear-gradient(180deg,#ffffff,#f3f8f4);border-top:1px solid #d5e4da}
.rail .steps{flex:1 1 auto;min-width:0}
.steps{position:relative;overflow:hidden;padding:2px 0 3px;touch-action:pan-y;cursor:grab}
.steps.dragging{cursor:grabbing}
.steps.dragging .step{pointer-events:none}
.steps-track{display:flex;gap:6px;width:max-content;margin:0;align-items:center;transition:transform .35s ease;will-change:transform}
.step{flex:0 0 auto;max-width:300px;min-height:30px;padding:4px 14px 4px 5px;border-radius:999px;border:1px solid #cfe0d4;background:#fff;color:#111;font-size:11px;line-height:1.2;display:flex;align-items:center;gap:7px;text-align:left;box-shadow:0 1px 4px #173c3b14;transition:background .2s,border-color .2s,box-shadow .2s}
.step .num{flex:0 0 20px;width:20px;height:20px;border-radius:50%;background:#e6f0e8;color:#111;font-size:10px;font-weight:700;display:grid;place-items:center}
.step:hover{border-color:#8dbf9d;box-shadow:0 2px 8px #173c3b22}
.step.done{background:#f1f9f2;border-color:#8dc79e}
.step.done .num{background:#2e9e5b;color:#fff}
.step.active{background:#d9ee9b;border-color:#8cb43a;box-shadow:0 2px 10px #8cb43a66;font-weight:600}
.step.active .num{background:#195658;color:#fff}
.steps .step.lock{opacity:.5}
.side-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:30;width:46px;height:46px;border-radius:50%;border:1px solid #ffffffaa;background:#ffffffe0;color:var(--teal);font-size:30px;line-height:1;padding:0 0 3px;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 16px #0006;transition:transform .15s,opacity .2s}
.side-nav.prev{left:10px}.side-nav.next{right:10px}
.side-nav:hover:not(:disabled){transform:translateY(-50%) scale(1.08)}
.side-nav:disabled{opacity:0;pointer-events:none}
body.rep .side-nav{display:none}
.rail{display:none!important}
@media(max-width:640px){.side-nav{width:36px;height:36px;font-size:24px;opacity:.9}.side-nav.prev{left:4px}.side-nav.next{right:4px}}

/* ===== MÀN HÌNH MỞ ĐẦU ===== */
.intro-screen{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#0b4a4f;color:#fff;text-align:center;padding:28px;transition:opacity .45s ease,visibility .45s ease}
.intro-screen.leaving{opacity:0;visibility:hidden;pointer-events:none}
.intro-bg{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse at 50% 20%,#3f9a7e 0%,#1c6a62 45%,#0b4a4f 100%)}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.08) translate(-1.5%,1%)}}
.gcells{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1;opacity:.45}
.gcells i{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9f7a8cc 0,#7bc46acc 38%,#2f8f3a99 72%,#1b5a2455 100%);box-shadow:inset 0 0 14px #ffffff55;animation:gdrift ease-in-out infinite alternate}
@keyframes gdrift{to{transform:translate(var(--dx),var(--dy))}}
.intro-tint{position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(20,82,80,.78),rgba(25,96,90,.62) 50%,rgba(10,52,58,.86))}
.intro-inner{position:relative;z-index:4;width:min(100%,1200px);display:flex;flex-direction:column;align-items:center}
.intro-brand{display:flex;align-items:center;margin-bottom:14px}
.intro-brand .brand-logo{height:34px;width:auto;filter:brightness(0) invert(1)}
.intro-kicker{font-size:12px;letter-spacing:.18em;font-weight:900;color:#d4ef73;margin-bottom:12px}
.intro-inner h1{font-size:clamp(28px,4.2vw,56px);line-height:1.1;letter-spacing:-.03em;margin:0 0 14px;font-weight:900;max-width:1000px;text-shadow:0 4px 24px #0007}
.intro-inner h1 em{font-style:normal;color:#c7e85e}
.intro-inner p{max-width:720px;font-size:clamp(13px,1.3vw,17px);line-height:1.65;color:#e1efeb;margin:0;text-shadow:0 2px 10px #0008}
.intro-rule{width:min(470px,72vw);height:4px;border-radius:9px;background:#c7e85e;margin:18px 0 15px}
.intro-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 0 18px}
.intro-tags span{background:#ffffff1f;border:1px solid #ffffff4d;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:700;backdrop-filter:blur(4px)}
.intro-start{border:1px solid #ffffff70;background:#ffffff14;color:#fff;border-radius:13px;padding:13px 25px;font-weight:900;font-size:15px;min-width:205px;transition:.2s;backdrop-filter:blur(4px)}
.intro-start:hover{background:#c7e85e;color:#174d4b;border-color:#c7e85e}
.intro-start span{padding-left:10px;color:#c7e85e}
.intro-start:hover span{color:#174d4b}
.intro-inner>small{font-size:12px;color:#c1dcd4;margin-top:15px}

/* ===== THẺ BƯỚC + BẢNG CÁC BƯỚC (góc phải) ===== */
.stageTabs{position:absolute;right:14px;top:14px;z-index:14;display:grid;gap:8px;width:226px}
.stab{display:flex;align-items:center;gap:10px;border:2px solid transparent;background:#fff;color:#16423c;border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px;text-align:left;cursor:pointer;box-shadow:0 4px 12px #0003;transition:.15s}
.stab i{font-style:normal;flex:0 0 22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#e6efec;font-size:12px}
.stab:hover{transform:translateX(-2px)}
.stab.on{background:#d6f45a;border-color:#b5d63a}.stab.on i{background:#f0fbb0}
.stab.done i{background:#2e9d5b;color:#fff}
.stab.lock{opacity:.55;cursor:not-allowed}.stab.lock i{background:#e1e6e4;font-size:11px}
.card{position:absolute;right:14px;top:226px;z-index:12;width:226px;background:#ffffffef;backdrop-filter:blur(8px);border-radius:14px;padding:10px 12px 11px;box-shadow:0 14px 40px #0005;border:1px solid #ffffffaa;animation:floatIn .4s ease;max-height:calc(100% - 240px);overflow:auto}
.card .k{display:none;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.12em;font-weight:900;color:var(--teal2)}
.card .badge{margin-left:auto;letter-spacing:0;font-size:12.5px;font-weight:800;background:#e6f3e0;color:#2c6a1f;border-radius:999px;padding:4px 12px;white-space:nowrap}
.card h2{margin:0;font-size:14.5px;line-height:1.25;color:var(--teal)}
.card p{margin:0;display:none}
.csteps{display:flex;flex-direction:column;gap:7px;margin-top:9px}
.csteps:empty{display:none}
.csteps span{display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:9px;font-size:12.5px;font-weight:700;color:#7d918c;text-align:left;line-height:1.2}
.csteps span b{flex:0 0 24px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#e4eeec;color:#7d918c;font-size:12.5px}
.csteps span.on{color:var(--teal)}
.csteps span.on b{background:#ffd23f;color:#2b1d00;box-shadow:0 0 0 4px #ffd23f55}
.csteps span.done b{background:#2e9d5b;color:#fff}
.csteps span.done{color:#2e7d4b}
.csteps .vs{cursor:pointer;border-radius:8px;transition:background .15s}
.csteps .vs:hover{background:#eef6f3}
.cguide{display:none}
@media(min-width:761px){
  .view.s2 ~ .s1-bottom,.view.s3 ~ .s1-bottom{display:none}
  .cguide:not(:empty){display:grid;gap:9px;margin-top:11px;padding-top:11px;border-top:1.5px solid #dfeae6}
  .cguide .gi{display:flex;gap:9px;align-items:flex-start}
  .cguide .say{flex:0 0 30px;width:30px;height:30px;border-radius:50%;border:0;background:#1f5d5a;color:#fff;display:grid;place-items:center;cursor:pointer}
  .cguide .txt{font-size:13.5px;line-height:1.45;color:#16423c;font-weight:600}
  .cguide .gp .pill1{width:100%;justify-content:center;padding:8px 12px;font-size:13px;box-shadow:none;border:1.5px solid #c7e36e}
}

/* ===== THANH THÔNG TIN Ở CHÂN + NÚT ===== */
.s1-bottom{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 250px 16px 70px;background:linear-gradient(180deg,transparent,#021f2599);pointer-events:none}
.s1-bottom>*{pointer-events:auto}
.s1-info{display:flex;align-items:center;gap:12px;text-align:left;max-width:min(94%,820px);background:#fffffff7;color:#16423c;border:2px solid #c7e36e;border-radius:16px;padding:9px 16px;font-size:clamp(14px,1.1vw,16px);font-weight:500;line-height:1.5;box-shadow:0 8px 24px #0008;animation:floatIn .3s ease}
.s1-info b{color:var(--teal);font-weight:900}
.s1-info .txt{flex:1 1 auto}
.s1-info small{font-size:.88em;color:#4a6660}
.s1-info .say,.cguide .say{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:0;background:var(--teal);color:#fff;display:grid;place-items:center;box-shadow:0 3px 8px #0004;cursor:pointer}
.s1-info .say:hover{background:var(--teal2)}
.s1-info.ok{border-color:#2e9d5b;background:#f1fbf4}
.s1-info.no{border-color:#e0a21b;background:#fff8ea}
.s1-pills{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;align-items:center}
.s1-pills:empty{display:none}
.pill1{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#16423c;border:2px solid #c7e36e;border-radius:999px;padding:9px 18px;font-size:clamp(14px,1.1vw,16px);font-weight:800;box-shadow:0 5px 16px #0007;transition:transform .15s,background .2s;cursor:pointer}
.pill1 i{font-style:normal;font-weight:900;font-size:1.15em}
.pill1:hover{transform:translateY(-2px)}
.pill1.warm{background:#ffe9c7;border-color:#e0a21b;color:#5a3a00}
.pill1.on{background:#ffd23f;border-color:#fff;color:#2b1d00}
.pill1.go{background:#ffb627;border-color:#fff;color:#2b1d00;font-size:clamp(15px,1.2vw,17px);padding:10px 22px;animation:goPulse 1.6s ease-in-out infinite}
@keyframes goPulse{50%{box-shadow:0 0 0 8px #ffb62744,0 5px 16px #0005}}
.pill1[disabled]{opacity:.5;cursor:default;transform:none}
.toast{position:absolute;left:50%;top:70px;transform:translate(-50%,-10px);z-index:50;background:#0f3f3de8;color:#fff;font-size:16px;font-weight:600;padding:10px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:all .3s;max-width:86%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== BƯỚC 1: CHỌN DỤNG CỤ ===== */
#sceneA{display:grid;place-items:center;padding:20px 250px 130px 14px}
.tools{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;width:100%;max-width:1080px}
.tools .tool{flex:0 0 calc((100% - 48px)/5);min-width:0}
.tool{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:#ffffffee;border:2px solid #d6e7da;border-radius:16px;padding:10px 8px;box-shadow:0 5px 14px #0003;cursor:pointer;color:#16423c;transition:transform .15s,border-color .2s,background .2s}
.tool:hover{transform:translateY(-3px)}
.tool .ic{font-size:34px;line-height:1;height:40px;display:grid;place-items:center}
.tool .ic.pic{height:auto;display:block;width:100%}
.tool .ic.pic img{display:block;width:100%;height:auto;aspect-ratio:1/1;max-height:clamp(70px,15vh,130px);object-fit:contain;margin:0 auto;border-radius:12px;background:linear-gradient(160deg,#9fd0c6,#4f8d97)}
.tool b{font-size:clamp(12.5px,1.05vw,15px);font-weight:800;text-align:center;line-height:1.2}
.tool u{position:absolute;right:7px;top:6px;width:22px;height:22px;border-radius:50%;background:#2e9d5b;color:#fff;text-decoration:none;font-size:13px;font-weight:900;display:none;place-items:center}
.tool.got{border-color:#2e9d5b;background:#eefaf1}.tool.got u{display:grid}
.tool.bad{animation:shake .4s;border-color:#d24a3a;background:#fff1ef}
.tool.need{border-color:#ffb627;animation:toolNeed 1.5s ease-in-out infinite}
@keyframes toolNeed{0%,100%{box-shadow:0 0 0 0 #ffb62799,0 5px 14px #0003;background:#ffffffee}50%{box-shadow:0 0 0 7px #ffb62744,0 5px 14px #0003;background:#fff6d8}}
.tool.hl{border-color:#ffb627;background:#fffbea;animation:toolHl 1s ease-in-out infinite;z-index:2}
.tool.hl:after{content:"👆";position:absolute;right:6px;bottom:4px;font-size:30px;filter:drop-shadow(0 3px 4px #0008);animation:handTap 1s ease-in-out infinite}
@keyframes toolHl{0%,100%{box-shadow:0 0 0 0 #ffb62799,0 5px 14px #0003}50%{box-shadow:0 0 0 10px #ffb62733,0 8px 22px #0005;transform:scale(1.04)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ===== BƯỚC 2: BÀN THÍ NGHIỆM 3D ===== */
#sceneB{overflow:hidden}
#sceneB canvas{display:block}
.tbar{position:absolute;left:12px;top:12px;z-index:6;display:flex;gap:8px}
.tb{border:0;background:#e8f0ef;color:#16423c;border-radius:12px;padding:10px 15px;font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 2px 8px #0003;transition:.15s}
.tb:hover{background:#fff;transform:translateY(-1px)}
.tb.off{background:#cfe0de}
.rotHint{position:absolute;left:50%;transform:translateX(-50%);z-index:5;background:#0b2a2ccc;color:#fff;border:1px solid #ffffff55;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;white-space:nowrap;transition:opacity .6s;pointer-events:none}
.loading3{position:absolute;inset:0;z-index:8;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;background:#0f3a3acc}
.clock3{position:absolute;left:calc(50% - 120px);top:64px;transform:translateX(-50%);z-index:7;display:flex;align-items:center;gap:12px;background:#0b2a2ce8;color:#fff;border:2px solid #ffd23f;border-radius:20px;padding:8px 18px 8px 10px;box-shadow:0 8px 24px #0008;pointer-events:none;animation:floatIn .3s ease}
.clock3 svg{width:62px;height:62px;flex:0 0 auto}
.clock3 b{display:block;font-size:20px;font-weight:900;letter-spacing:.02em;white-space:nowrap}
.clock3 small{display:block;font-size:13px;color:#cfe6e0;font-weight:700;white-space:nowrap}
.clock3 .bar{height:6px;border-radius:9px;background:#ffffff2e;margin-top:5px;overflow:hidden}.clock3 .bar i{display:block;height:100%;width:0;background:#ffd23f}
#ln3{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
#ln3 line{stroke:#e6f27c;stroke-width:1.5;stroke-dasharray:4 3}
#ln3 circle{fill:#d4ef73;stroke:#16423c;stroke-width:1.5}
.n3{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;white-space:nowrap;pointer-events:none}
.n3.lf{flex-direction:row-reverse}
.n3 b{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:#d4ef73;color:#16423c;font-size:13px;font-weight:900;display:grid;place-items:center;box-shadow:0 0 0 2px #16423c66,0 3px 8px #0007}
.n3 span{font-size:clamp(11.5px,1vw,13.5px);font-weight:800;color:#fff;background:#0b2a2cd9;border:1px solid #ffffff38;border-radius:8px;padding:2px 9px}
.n3.on b{background:#ffd23f;box-shadow:0 0 0 4px #ffd23f66,0 3px 8px #0007}.n3.on span{border-color:#ffd23f;color:#ffe27a}
.hand3{position:absolute;left:0;top:0;z-index:6;pointer-events:none;width:34px;height:40px}
.hand3 span{position:absolute;left:0;top:6px;font-size:34px;line-height:1;filter:drop-shadow(0 3px 4px #000b);animation:handTap 1s ease-in-out infinite}
.hand3 i{position:absolute;left:3px;top:-6px;width:28px;height:28px;border-radius:50%;border:3px solid #ffd23f;opacity:0;animation:handRing 1s ease-out infinite}
@keyframes handTap{0%,100%{transform:translateY(8px) scale(1)}45%{transform:translateY(-2px) scale(.94)}55%{transform:translateY(-2px) scale(.94)}}
@keyframes handRing{0%,40%{opacity:0;transform:scale(.4)}55%{opacity:.95;transform:scale(.6)}100%{opacity:0;transform:scale(1.5)}}

/* ===== BƯỚC 3: QUAN SÁT KẾT QUẢ ===== */
#sceneC{overflow:hidden;background:#195658}
#obs{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#obs.dragging{cursor:grabbing}
.guide3{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;padding:70px 14px 110px;background:rgba(10,44,46,.86);backdrop-filter:blur(4px);animation:floatIn .4s ease}
.gbox{background:#fff;border-radius:20px;padding:18px 20px 16px;width:min(100%,560px);box-shadow:0 18px 50px #000a;max-height:100%;overflow:auto}
.gbox h4{margin:0 0 12px;font-size:clamp(17px,1.8vw,22px);color:var(--teal)}
.gbox ol{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:10px}
.gbox li{display:grid;grid-template-columns:42px 1fr;gap:10px;align-items:center;font-size:clamp(14px,1.2vw,16.5px);line-height:1.45;color:#2e4d48}
.gbox li i{font-style:normal;font-size:26px;width:42px;height:42px;border-radius:50%;background:#e6f3e0;display:grid;place-items:center}
.gbox .pill1{display:flex;margin:0 auto}
.obsInfo{position:absolute;left:14px;top:14px;z-index:6;width:min(360px,calc(100% - 270px));background:#ffffffee;border-radius:16px;padding:12px 14px;box-shadow:0 12px 32px #0004;font-size:14.5px;line-height:1.5;color:#2e4d48;animation:floatIn .3s ease}
.obsInfo{padding-right:52px}
.obsInfo .xbtn{position:absolute;top:10px;right:10px;width:32px;height:32px;border:none;border-radius:99px;background:#EEF3F2;color:#1d3b37;font-size:14px;line-height:1;cursor:pointer;display:grid;place-items:center}
.obsInfo .xbtn:hover{background:#DCE6E4}
.obsInfo h5{margin:0 0 4px;font-size:16px;color:var(--teal)}
.obsInfo .sw{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px;box-shadow:0 0 0 2px #fff,0 0 0 3px #0003}

/* =====================================================================

   5 bước: Chuẩn bị dụng cụ · Dự đoán · Thí nghiệm · Tia nhiệt · Kết luận

const $id=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rng(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const view=$id('view');
const DEBUG=/[?&]debug/.test(location.search);
const STAGES=[
  {short:'Chuẩn bị dụng cụ', tab:'Chuẩn bị dụng cụ',       badge:'Chuẩn bị',  goal:'Tìm hiểu các dụng cụ thí nghiệm'},

const S={stage:0,narr:true,lastSay:null,lastVk:null,active:false,ok:[false,false,false,false,false],miss:false,predict:null,played:{},speed:1,vok:0,moDone:false};
const LOCKMSG=['','Em hãy xem các dụng cụ ở bước 1 trước nhé.','Em hãy chọn dự đoán ở bước 2 trước nhé.','Em hãy làm xong thí nghiệm ở bước 3 trước nhé.','Em hãy tìm ra cách truyền nhiệt ở bước 4 trước nhé.'];

/* ===== GIỌNG ĐỌC ===== */
let viVoice=null;
function pickVoice(){ try{ const v=speechSynthesis.getVoices(); viVoice=v.find(x=>/^vi[-_]?VN/i.test(x.lang))||v.find(x=>/^vi/i.test(x.lang))||null; }catch(e){} }
if(window.speechSynthesis){ pickVoice(); try{ speechSynthesis.addEventListener('voiceschanged',pickVoice); }catch(e){} }
const VOICE={
  mo:'',                                                              // 01 Mở đầu — CHƯA CÓ FILE (đọc VTEXT bằng giọng trình duyệt)
  dc:'https://assets.yoolife.com.vn/yootek/1793989517913-2363.mp3',  // 02 Dụng cụ
  dd:'https://assets.yoolife.com.vn/yootek/1793989522486-7701.mp3',  // 03 Dự đoán
  bd:'https://assets.yoolife.com.vn/yootek/1793989526852-5207.mp3',  // 04 Bật đèn
  cg:'https://assets.yoolife.com.vn/yootek/1793989530762-2975.mp3',  // 05 Chắn gỗ
  kq:'https://assets.yoolife.com.vn/yootek/1793989534857-9622.mp3',  // 06 Kết quả thí nghiệm
  dn:'https://assets.yoolife.com.vn/yootek/1793989539035-9684.mp3',  // 07 Không phải dẫn nhiệt
  dl:'https://assets.yoolife.com.vn/yootek/1793989543028-3474.mp3',  // 08 Không phải đối lưu
  tn:'https://assets.yoolife.com.vn/yootek/1793989547094-6440.mp3',  // 09 Tia nhiệt
  bm:'https://assets.yoolife.com.vn/yootek/1793989551265-4740.mp3',  // 10 Bề mặt
  kb:'https://assets.yoolife.com.vn/yootek/1793989555299-7607.mp3',  // 11 Kết quả bề mặt
  kl:'https://assets.yoolife.com.vn/yootek/1793989734413-9016.mp3'   // 12 Kết luận
};
const VTEXT={
  mo:'Chào mừng em đến với thí nghiệm khám phá bức xạ nhiệt. Ở phần trước, chúng ta đã thắc mắc: giữa Mặt Trời và Trái Đất là chân không, chẳng có chất lưu nào, vậy nhiệt truyền tới bằng cách nào? Hôm nay chúng ta sẽ tìm ra một cách truyền nhiệt mới. Em hãy bấm Bắt đầu nhé!',
  dc:'Đây là bàn thí nghiệm. Em hãy bấm vào từng số để xem tên và công dụng của các dụng cụ: bình thủy tinh phủ đen có cắm nhiệt kế, bình thủy tinh tráng bạc, đèn điện dây tóc, tấm gỗ dày và giá đỡ.',
  dd:'Bình thủy tinh phủ đen được đặt cạnh một bóng đèn. Nếu bật đèn, nhiệt độ trong bình sẽ thay đổi thế nào? Và nếu đặt một tấm gỗ chắn giữa đèn và bình thì sao? Em hãy chọn một đáp án.',
  bd:'Em hãy bấm công tắc để bật đèn, rồi quan sát nhiệt kế trong bình thủy tinh phủ đen.',
  cg:'Nhiệt độ trong bình đang tăng lên. Bây giờ em hãy kéo tấm gỗ đặt vào giữa đèn và bình, rồi tiếp tục quan sát nhiệt kế.',
  kq:'Khi bật đèn, nhiệt độ trong bình tăng lên. Khi có tấm gỗ chắn, nhiệt độ giảm dần về như cũ. Bỏ tấm gỗ ra, nhiệt độ lại tăng. Vậy năng lượng từ đèn đã truyền tới bình bằng cách nào? Em hãy kiểm tra lần lượt từng khả năng nhé.',
  dn:'Có phải là dẫn nhiệt không? Giữa đèn và bình chỉ có không khí, mà không khí dẫn nhiệt kém nhất. Vì vậy, nhiệt không thể truyền tới bình nhanh như thế bằng dẫn nhiệt.',
  dl:'Có phải là đối lưu không? Không khí được đèn làm nóng sẽ bay lên phía trên, chứ không đi ngang sang bình. Hơn nữa, một tấm gỗ không thể chặn được dòng không khí đi lên. Vậy đây cũng không phải là đối lưu.',
  tn:'Hãy bật camera tia nhiệt. Em thấy không? Đèn phát ra những tia đi thẳng tới bình, và bị tấm gỗ chặn lại. Đó là các tia nhiệt. Tia nhiệt có tính chất giống tia sáng: mang năng lượng, truyền thẳng, phản xạ được và không truyền qua vật chắn sáng. Hình thức truyền nhiệt này gọi là bức xạ nhiệt.',
  bm:'Bây giờ, em hãy đặt thêm một bình thủy tinh tráng bạc, cách đèn bằng bình phủ đen. Theo em, bình nào sẽ nóng lên nhanh hơn? Hãy bật đèn và quan sát hai nhiệt kế.',
  kb:'Bình phủ đen nóng lên nhanh hơn hẳn. Mặt ngoài sẫm màu và xù xì hấp thụ tia nhiệt mạnh. Còn mặt ngoài sáng màu và nhẵn bóng lại phản xạ tia nhiệt, nên bình tráng bạc nóng chậm hơn.',
  kl:'Năng lượng nhiệt được truyền bằng các tia nhiệt gọi là bức xạ nhiệt. Tia nhiệt truyền được cả trong chân không, nhờ vậy Mặt Trời mới sưởi ấm được Trái Đất. Mặt ngoài của vật càng sẫm màu và càng xù xì thì hấp thụ tia nhiệt càng mạnh, càng nhẵn và sáng màu thì phản xạ tia nhiệt càng mạnh. Vậy vì sao Trái Đất giữ được hơi ấm của Mặt Trời? Cùng khám phá ở phần tiếp theo nhé!'
};
const _pre=[]; Object.keys(VOICE).forEach(k=>{ if(VOICE[k]){ try{ const a=new Audio(VOICE[k]); a.preload='auto'; _pre.push(a); }catch(e){} } });
const _aud=new Audio(); _aud.preload='auto'; let _onEnd=null, _fb=null;
_aud.addEventListener('ended',()=>{ const f=_onEnd; _onEnd=null; _fb=null; if(f){ try{ f(); }catch(e){} } });
_aud.addEventListener('playing',()=>{ S.vok=1; });
_aud.addEventListener('error',()=>{ const f=_fb; _fb=null; if(f) f(); });
function stopSpeak(){ _onEnd=null; _fb=null; try{ _aud.pause(); }catch(e){} try{ window.speechSynthesis&&speechSynthesis.cancel(); }catch(e){} }
/* chỉ một giọng tại một thời điểm; có URL → phát file; URL rỗng / lỗi → đọc VTEXT bằng giọng trình duyệt (không có giọng vi-VN thì im lặng) */
function speak(html,force,key,onEnd){
  S.lastSay=html; S.lastVk=key||null; stopSpeak(); if(!html&&!key) return; if(!S.narr&&!force) return;
  const url=key&&VOICE[key], txt=html||(key&&VTEXT[key]);
  const say=()=>{ if(!txt||!viVoice) return; const t=String(txt).replace(/<[^>]+>/g,'').replace(/[→↑↓]/g,' ').replace(/\s+/g,' ').trim(); if(!t) return;
    const u=new SpeechSynthesisUtterance(t); u.voice=viVoice; u.lang=viVoice.lang; u.rate=1; u.onstart=()=>{ S.vok=1; }; if(onEnd) u.onend=()=>{ try{ onEnd(); }catch(e){} };
    try{ speechSynthesis.speak(u); }catch(e){} };
  if(url){ _onEnd=onEnd||null; _fb=say; try{ _aud.src=url; _aud.currentTime=0; const pr=_aud.play(); if(pr&&pr.catch) pr.catch(err=>{ if(!(err&&err.name==='NotAllowedError')){ const f=_fb; _fb=null; if(f) f(); } }); }catch(e){ say(); } return; }
  say();
}
/* mỗi voice tự phát đúng 1 lần (S.played); nút loa .say nghe lại */
function voiceOnce(key,onEnd){ if(S.played[key]) return false; S.played[key]=true; speak(null,false,key,onEnd); return true; }

/* ===== ÂM THANH (WebAudio) ===== */
const AC=()=>beep.c||(beep.c=new (window.AudioContext||window.webkitAudioContext)());
function beep(ok){ if(!S.narr) return; try{ const a=AC();
  (ok?[[660,0],[880,.12]]:[[220,0],[170,.14]]).forEach(([f,d])=>{ const o=a.createOscillator(), g=a.createGain(); o.type=ok?'sine':'triangle'; o.frequency.value=f; g.gain.setValueAtTime(0,a.currentTime+d); g.gain.linearRampToValueAtTime(.1,a.currentTime+d+.02); g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d+.22); o.connect(g); g.connect(a.destination); o.start(a.currentTime+d); o.stop(a.currentTime+d+.25); }); }catch(e){} }
function noiseBuf(a,dur){ const b=a.createBuffer(1,Math.max(1,Math.floor(a.sampleRate*dur)),a.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; }
function sfx(name){
  if(!S.narr) return;
  try{ const a=AC(); if(a.state==='suspended') a.resume(); const t=a.currentTime;
    const env=(g,v,at,dur)=>{ g.gain.setValueAtTime(0,t+at); g.gain.linearRampToValueAtTime(v,t+at+.005); g.gain.exponentialRampToValueAtTime(.0001,t+at+dur); };
    if(name==='click'){ const o=a.createOscillator(), g=a.createGain(); o.type='square'; o.frequency.value=1500; env(g,.05,0,.04); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+.06); }
    else if(name==='thud'){ const n=a.createBufferSource(), lp=a.createBiquadFilter(), g=a.createGain(); n.buffer=noiseBuf(a,.14); lp.type='lowpass'; lp.frequency.value=420; env(g,.16,0,.12); n.connect(lp); lp.connect(g); g.connect(a.destination); n.start(t);
      const o=a.createOscillator(), g2=a.createGain(); o.type='sine'; o.frequency.setValueAtTime(130,t); o.frequency.exponentialRampToValueAtTime(70,t+.12); env(g2,.14,0,.14); o.connect(g2); g2.connect(a.destination); o.start(t); o.stop(t+.18); }
    else if(name==='whoosh'){ const n=a.createBufferSource(), bp=a.createBiquadFilter(), g=a.createGain(); n.buffer=noiseBuf(a,.5); bp.type='bandpass'; bp.Q.value=1.2; bp.frequency.setValueAtTime(300,t); bp.frequency.exponentialRampToValueAtTime(1400,t+.4); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.07,t+.15); g.gain.exponentialRampToValueAtTime(.0001,t+.5); n.connect(bp); bp.connect(g); g.connect(a.destination); n.start(t); }
    else if(name==='tada'){ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(), g=a.createGain(); o.type='sine'; o.frequency.value=f; env(g,.08,i*.13,.3); o.connect(g); g.connect(a.destination); o.start(t+i*.13); o.stop(t+i*.13+.34); }); }
  }catch(e){}
}
/* tiếng ù rất nhỏ khi đèn sáng (100 Hz + bội âm) */
const HUM={want:false,on:null};
function setHum(want){
  HUM.want=!!want; const should=HUM.want&&S.narr;
  try{
    if(should&&!HUM.on){ const a=AC(); if(a.state==='suspended') a.resume(); const g=a.createGain(); g.gain.value=0; g.gain.linearRampToValueAtTime(.022,a.currentTime+.3); g.connect(a.destination);
      const os=[100,200,300].map((f,i)=>{ const o=a.createOscillator(); o.type=i?'sine':'triangle'; o.frequency.value=f; const gg=a.createGain(); gg.gain.value=[1,.5,.25][i]; o.connect(gg); gg.connect(g); o.start(); return o; }); HUM.on={g,os}; }
    else if(!should&&HUM.on){ const h=HUM.on; HUM.on=null; const a=AC(); h.g.gain.cancelScheduledValues(a.currentTime); h.g.gain.setValueAtTime(h.g.gain.value,a.currentTime); h.g.gain.linearRampToValueAtTime(0,a.currentTime+.2); setTimeout(()=>h.os.forEach(o=>{ try{ o.stop(); }catch(e){} }),260); }
  }catch(e){}
}
function toast(m){ const t=$id('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2600); }

/* ===== GIAO DIỆN CHUNG ===== */
const SPK='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';

const pill=(ico,t,act,o={})=>`<button class="pill1 ${o.cls||''}" type="button" data-act="${act}" ${o.i!=null?`data-i="${o.i}"`:''} ${o.k?`data-k="${o.k}"`:''} ${o.dis?'disabled':''}><i>${ico}</i>${esc(t)}</button>`;
let lastKey='';
/* vk: file giọng của thông báo (tự phát 1 lần, nút loa nghe lại); say: câu đọc bằng giọng trình duyệt (chỉ bước 1); không có cả hai → chỉ hiện chữ */
function setBottom(info,pills,key,say,cls,vk,onEnd){
  const k=S.stage+'|'+key+'|'+info; if(k===lastKey) return; lastKey=k;
  const bi=$id('binfo'); bi.className='s1-info'+(cls?' '+cls:''); bi.innerHTML=sayBox(info); $id('bpills').innerHTML=pills;
  if(!S.active){ S.lastSay=null; S.lastVk=null; return; }   /* chưa bấm «Bắt đầu thực hành» (màn mở đầu): không phát, không đánh dấu đã phát */
  if(vk){ S.lastSay=null; S.lastVk=vk; if(!S.played[vk]){ S.played[vk]=true; speak(null,false,vk,onEnd); } }

/* đo Box3 rồi scale đều về chiều cao mục tiêu; căn giữa x,z; đáy ở y=0 */
function normModel(s,h){
  s.updateMatrixWorld(true); const bb=new THREE.Box3().setFromObject(s), sz=bb.getSize(V3(0,0,0)); const k=sz.y>1e-6?h/sz.y:1; s.scale.multiplyScalar(k); s.updateMatrixWorld(true);
  const b2=new THREE.Box3().setFromObject(s), c=b2.getCenter(V3(0,0,0)); s.position.set(s.position.x-c.x,s.position.y-b2.min.y,s.position.z-c.z);
  const w=new THREE.Group(); w.add(s); w.updateMatrixWorld(true); return w;

function fallbackModel(k){

function loadModels(){
  if(modelsPromise) return modelsPromise;
  const GL=new GLTFLoader(); GL.setMeshoptDecoder(MeshoptDecoder);
  modelsPromise=Promise.all(Object.keys(MODELS).map(k=>{
    const url=`https://3d-cdn.yoolife.com.vn/${MODELS[k]}/${MODELS[k]}.glb`;
    const tmo=new Promise((_,rej)=>setTimeout(()=>rej(new Error('quá thời gian chờ')),25000));
    return Promise.race([GL.loadAsync(url),tmo]).then(g=>{
      if(DEBUG){ const n=[]; g.scene.traverse(o=>{ if(o.isMesh) n.push(o.name+' ['+(o.material&&o.material.name)+']'); }); console.log('[GLB '+k+'] '+n.length+' mesh:',n.join(' | ')); }
      MD[k]=normModel(g.scene,SIZE[k]);
    }).catch(e=>{ console.warn('Không tải được mô hình',k,e); MD[k]=normModel(fallbackModel(k),SIZE[k]); });
  }));
  return modelsPromise;
}
function cloneModel(k){ const o=MD[k].clone(true); o.traverse(m=>{ if(m.isMesh&&m.material){ m.material=Array.isArray(m.material)?m.material.map(x=>x.clone()):m.material.clone(); } }); return o; }
function blobTexture(){ const c=document.createElement('canvas'); c.width=c.height=64; const x=c.getContext('2d'), g=x.createRadialGradient(32,32,2,32,32,32); g.addColorStop(0,'rgba(0,0,0,.5)'); g.addColorStop(1,'rgba(0,0,0,0)'); x.fillStyle=g; x.fillRect(0,0,64,64); return new THREE.CanvasTexture(c); }
function glowTexture(r,g,b){ const c=document.createElement('canvas'); c.width=c.height=64; const x=c.getContext('2d'), gr=x.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0,`rgba(${r},${g},${b},1)`); gr.addColorStop(.35,`rgba(${r},${g},${b},.45)`); gr.addColorStop(1,`rgba(${r},${g},${b},0)`); x.fillStyle=gr; x.fillRect(0,0,64,64); return new THREE.CanvasTexture(c); }
/* vân gỗ tối */
function woodTexture(){
  const c=document.createElement('canvas'); c.width=c.height=256; const x=c.getContext('2d'); x.fillStyle='#43352b'; x.fillRect(0,0,256,256);
  for(let i=0;i<70;i++){ x.strokeStyle=`rgba(${i%2?'20,14,10':'110,88,70'},${(.1+Math.random()*.18).toFixed(2)})`; x.lineWidth=.6+Math.random()*2; const y=Math.random()*256; x.beginPath(); x.moveTo(0,y); x.bezierCurveTo(80,y+Math.random()*8-4,170,y+Math.random()*8-4,256,y+Math.random()*6-3); x.stroke(); }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(2,1); return t;
}
/* nhiễu nhẹ cho mặt phủ đen (xù xì) */
function roughTexture(){
  const c=document.createElement('canvas'); c.width=c.height=128; const x=c.getContext('2d'), im=x.createImageData(128,128);
  for(let i=0;i<im.data.length;i+=4){ const v=110+Math.random()*120; im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255; } x.putImageData(im,0,0);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(5,5); return t;
}

/* đỉnh của mô hình trong toạ độ của nhóm cha */
function eachVertex(root,fn){
  root.updateMatrixWorld(true); const v=V3(0,0,0);
  root.traverse(o=>{ if(!o.isMesh||!o.visible||!o.geometry||!o.geometry.attributes.position) return; const P=o.geometry.attributes.position;
    for(let i=0;i<P.count;i++){ v.fromBufferAttribute(P,i).applyMatrix4(o.matrixWorld); fn(v,o); } });
}
/* bình thuỷ tinh: gốc nhóm = tâm bầu bình; nhiệt kế cắm qua nút, bầu thuỷ ngân ở tâm bầu */
function makeFlask(kind,targetH){
  const G=new THREE.Group(), m=cloneModel('flask'); G.add(m); if(targetH) m.scale.multiplyScalar(clamp(targetH/SIZE.flask,.7,1.4));
  m.traverse(o=>{ if(o.isMesh&&/liquid|fluid/i.test((o.name||'')+' '+((o.material&&o.material.name)||''))) o.visible=false; });
  m.updateMatrixWorld(true);
  const bb=new THREE.Box3().setFromObject(m), sz=bb.getSize(V3(0,0,0)), cx=(bb.min.x+bb.max.x)/2, cz=(bb.min.z+bb.max.z)/2;
  const r=Math.min(Math.max(sz.x,sz.z)/2,sz.y*.45), bc=V3(cx,bb.min.y+r,cz);
  m.position.set(-bc.x,-bc.y,-bc.z); G.updateMatrixWorld(true);
  const mouthY=bb.max.y-bc.y;
  const mat=kind==='black'
    ? new THREE.MeshStandardMaterial({color:0x1c1c1c,roughness:.92,metalness:0,bumpMap:roughTexture(),bumpScale:1.4,emissive:0xff5a1a,emissiveIntensity:0})
    : new THREE.MeshStandardMaterial({color:0xe3e8ec,roughness:.08,metalness:1,envMapIntensity:3.2,emissive:0xff5a1a,emissiveIntensity:0});
  let stopper=null;
  m.traverse(o=>{ if(!o.isMesh) return; const nm=(o.name||'')+' '+((o.material&&o.material.name)||'');
    if(/stopper|cork|cap|plug|nut|lid/i.test(nm)){ stopper=o; o.material=stdM(0x3a3a3a,{roughness:.85}); } else { o.material=mat; o.renderOrder=0; } });
  /* bán kính cổ bình (các đỉnh cách miệng ≤ 1,2 cm) */
  let rn=0; eachVertex(m,v=>{ if(v.y>mouthY-1.2){ rn=Math.max(rn,Math.hypot(v.x,v.z)); } }); rn=clamp(rn||1.7,1.1,3.2);
  if(!stopper){ const st=new THREE.Mesh(new THREE.CylinderGeometry(rn*1.3,rn*.9,2.4,24),stdM(0x3a3a3a,{roughness:.85})); st.position.set(0,mouthY-.3,0); G.add(st); }
  /* nhiệt kế */
  const TH=new THREE.Group(); G.add(TH);
  const plate=addTo(TH,new THREE.Mesh(new THREE.BoxGeometry(2.4,22-mouthY-.4,.12),stdM(0xf4f6f2,{roughness:.6})),0,(22+mouthY+.4)/2,-.55);
  const yTop=T=>lerp(mouthY+2,21,clamp((T-20)/30,0,1));
  for(let T=20;T<=50;T+=5){ const tk=addTo(TH,new THREE.Mesh(new THREE.BoxGeometry(T%10?1.0:1.6,.1,.14),stdM(0x333333,{roughness:.6})),0,yTop(T),-.45); tk.position.x=T%10?-.7:-.4; }
  addTo(TH,new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,22,14),glassM(0xffffff,.35)),0,11,0).renderOrder=7;
  addTo(TH,new THREE.Mesh(new THREE.SphereGeometry(.72,14,10),stdM(0xd9342b,{roughness:.3,emissive:0x550000})),0,0,0);
  const colG=new THREE.CylinderGeometry(.15,.15,1,10); colG.translate(0,.5,0);
  const col=addTo(TH,new THREE.Mesh(colG,stdM(0xd9342b,{roughness:.3,emissive:0x660000})),0,0,0); col.renderOrder=8;
  const setT=T=>{ col.scale.y=Math.max(.3,yTop(T)); };
  setT(T_AIR);
  G.userData={kind,r,mouthY,rn,mat,TH,setT,yTop,neckY:mouthY-3.2};
  return G;
}
/* giá đỡ: mô hình đã có kẹp + một bình mẫu → ẩn bình mẫu (thuỷ tinh, chất lỏng), lấy vị trí bình mẫu làm chuẩn:
   tâm bầu bình = tâm bình thật; nếu mô hình không có bình mẫu (hình dự phòng) thì dựng kẹp bằng code */
function standInfo(m){
  let sg=null; m.traverse(o=>{ if(!o.isMesh) return; const nm=(o.name||'')+' '+((o.material&&o.material.name)||''); if(/flask_glass/i.test(nm)) sg=o; if(/flask|glass|liquid|fluid/i.test(nm)) o.visible=false; });
  m.updateMatrixWorld(true);
  let hMax=0; eachVertex(m,v=>{ hMax=Math.max(hMax,v.y); }); let sx=0,sz=0,n=0; eachVertex(m,v=>{ if(v.y>hMax*.45){ sx+=v.x; sz+=v.z; n++; } });
  const pole={x:n?sx/n:0,z:n?sz/n:0};
  if(sg){ const bb=new THREE.Box3().setFromObject(sg), s=bb.getSize(V3(0,0,0)); return {own:true,cx:(bb.min.x+bb.max.x)/2,cz:(bb.min.z+bb.max.z)/2,minY:bb.min.y,h:s.y,r:Math.min(Math.max(s.x,s.z)/2,s.y*.45),pole}; }
  return {own:false,cx:pole.x+8,cz:pole.z,minY:4,h:18,r:6.5,pole};
}
function makeStand(fx,fz){
  const G=new THREE.Group(), m=cloneModel('stand'); G.add(m);
  const info=standInfo(m); G.position.set(fx-info.cx,0,fz-info.cz);
  if(!info.own){   /* kẹp dựng bằng code: cần ngang từ cột tới vòng kẹp quanh cổ bình */
    const metal=stdM(0xc5ccd1,{metalness:.75,roughness:.28}), ny=info.minY+info.h-4, rr=2.1;
    addTo(G,new THREE.Mesh(new THREE.BoxGeometry(2.2,2.2,2.2),metal),info.pole.x,ny,info.pole.z);
    const len=Math.abs(info.cx-rr-info.pole.x); const arm=addTo(G,new THREE.Mesh(new THREE.CylinderGeometry(.32,.32,len,10),metal),(info.pole.x+info.cx-rr)/2,ny,info.cz); arm.rotation.z=Math.PI/2;
    const ring=addTo(G,new THREE.Mesh(new THREE.TorusGeometry(rr,.3,10,32),metal),info.cx,ny,info.cz); ring.rotation.x=Math.PI/2;
  }
  G.userData={info,pole:V3(fx-info.cx+info.pole.x,0,fz-info.cz+info.pole.z)};
  return G;
}
/* tấm gỗ dày trên chân đế chữ T: gốc nhóm = giữa chân đế trên mặt bàn; mặt tấm vuông góc đường nối đèn – bình (pháp tuyến theo trục x) */
function makeBoard(){
  const G=new THREE.Group(), wm=stdM(0xffffff,{map:woodTexture(),roughness:.6,emissive:0xffc933,emissiveIntensity:0});
  const slab=addTo(G,new THREE.Mesh(new THREE.BoxGeometry(BOARD_T,BOARD_H,BOARD_W),wm),0,BOARD_Y0+BOARD_H/2,0);
  const wm2=wm.clone(); wm2.map=wm.map; const ph=Math.max(.3,BOARD_Y0-1.2);
  addTo(G,new THREE.Mesh(new THREE.BoxGeometry(2,ph+.4,3),wm2),0,1.2+ph/2-.2,0);
  addTo(G,new THREE.Mesh(new THREE.BoxGeometry(9,1.2,14),wm2),0,.6,0);
  G.userData={slab,mats:[wm,wm2]};
  return G;
}

  { const si=standInfo(cloneModel('stand')); H_C=si.minY+si.r; FLASK_H=si.h; BOARD_Y0=Math.max(2,H_C-BOARD_H/2); _cB.set(FB.x,H_C,FB.z); _cS.set(FS.x,H_C,FS.z); if(DEBUG) console.log('[Đo] H_C =',H_C.toFixed(2),'cao bình mẫu =',FLASK_H.toFixed(2),'bầu bình r =',si.r.toFixed(2)); }

    addTo(sc,new THREE.Mesh(new THREE.BoxGeometry(tw,.2,td),tm),tx,.1,tz);

    addTo(sc,new THREE.Mesh(new THREE.BoxGeometry(.8,1.2,td),rm),tx-tw/2,.6,tz); addTo(sc,new THREE.Mesh(new THREE.BoxGeometry(.8,1.2,td),rm),tx+tw/2,.6,tz); };
  mkTray(TRAY.x,TRAY.z,TRAY.w,TRAY.d);

    if(/filament|wire|coil|day/i.test(nm)) parts.fil.push(o); else if(/base|socket|cap|duoi/i.test(nm)) parts.base.push(o); else if(/glass|bulb|bong/i.test(nm)) parts.glass.push(o); });

  bm.updateMatrixWorld(true);
  let gc=SIZE.bulb*.62; if(parts.glass.length){ const gb=new THREE.Box3(); parts.glass.forEach(o=>gb.expandByObject(o)); const c=gb.getCenter(V3(0,0,0)); if(c.y>SIZE.bulb*.35&&c.y<SIZE.bulb*.9) gc=c.y; }
  let by=H_C-gc;                                                 /* tâm bóng đèn ở độ cao H_C */

const _o=V3(0,0,0), _p=V3(0,0,0), _n=V3(0,0,0), _rf=V3(0,0,0), _Y=V3(0,1,0), _c=V3(0,0,0);

  const on=B3.lampOn&&B3.thermal>.02; B3.rays.visible=on; if(!on) return;

  for(let i=0;i<B3.rl.length;i++){
    const r=B3.rl[i], d=r.dir; let best=80, kind=0, t;

    else if(kind===1){ r.ht.position.copy(_p); r.ht.material.opacity=.35*th; r.ht.scale.setScalar(4); }

    }

}
