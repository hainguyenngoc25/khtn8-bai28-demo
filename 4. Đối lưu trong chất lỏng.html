<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#195658">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400&display=swap" rel="stylesheet">
<link rel="icon" href="data:,">
<title>Khoa học tự nhiên 8 – Đối lưu trong chất lỏng</title>
<style>
:root{--teal:#195658;--teal2:#28756b;--lime:#c7e36e;--ink:#173c3b;--muted:#68817a;--paper:#f4f8f3;--line:#dbe8df;--white:#fff;--deep:#0f3a3a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;min-height:0;overflow:hidden;font-family:Roboto,"Segoe UI",Arial,sans-serif;color:var(--ink);background:#e9f0eb}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #e7ac4f;outline-offset:2px}
[hidden]{display:none!important}

/* ===== HEADER ===== */
header{height:52px;flex:0 0 52px;background:#fff;display:flex;align-items:center;gap:14px;padding:8px 16px;border:1px solid #dce5df;position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;white-space:nowrap}
.brand-logo{height:30px;width:auto;display:block}
.headtext{border-left:1px solid #d7e3db;padding-left:14px;line-height:1.25;min-width:0}
.headtext b{display:block;font-size:12px;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.headtext strong{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.headtools{margin-left:auto;display:flex;gap:8px}
.headtools button{border:1px solid var(--line);border-radius:11px;background:white;color:var(--teal);padding:8px 11px;font-size:12px;font-weight:800;white-space:nowrap}

/* ===== BỐ CỤC ===== */
main{width:100%;height:calc(100dvh - 52px);min-height:0;overflow:hidden;display:flex;flex-direction:column}
.lesson-layout{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;user-select:none}
.viewer{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:#fff;overflow:hidden;position:relative}
.view-content{flex:1 1 auto;min-height:0;position:relative}
.visual{position:absolute;inset:0;overflow:hidden;background:var(--deep)}
@keyframes floatIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.view{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:radial-gradient(ellipse at 50% 30%,#3f8a7e 0%,#245f60 55%,#17474a 100%)}
#sceneA,#sceneB,#sceneC{position:absolute;inset:0}
#sceneA[hidden],#sceneB[hidden],#sceneC[hidden]{display:none}
.view.s2{background:radial-gradient(circle at 50% 46%,#fffbea 0%,#f3eed0 50%,#ddd5ac 100%)}
.view.s3{background:#e8efed}

/* ===== THANH CÁC BƯỚC ===== */
.rail{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:4px 10px;background:linear-gradient(180deg,#ffffff,#f3f8f4);border-top:1px solid #d5e4da}
.rail .steps{flex:1 1 auto;min-width:0}
.steps{position:relative;overflow:hidden;padding:2px 0 3px;touch-action:pan-y;cursor:grab}
.steps.dragging{cursor:grabbing}
.steps.dragging .step{pointer-events:none}
.steps-track{display:flex;gap:6px;width:max-content;margin:0;align-items:center;transition:transform .35s ease;will-change:transform}
.step{flex:0 0 auto;max-width:300px;min-height:30px;padding:4px 14px 4px 5px;border-radius:999px;border:1px solid #cfe0d4;background:#fff;color:#111;font-size:11px;line-height:1.2;display:flex;align-items:center;gap:7px;text-align:left;box-shadow:0 1px 4px #173c3b14;transition:background .2s,border-color .2s,box-shadow .2s}
.step .num{flex:0 0 20px;width:20px;height:20px;border-radius:50%;background:#e6f0e8;color:#111;font-size:10px;font-weight:700;display:grid;place-items:center}
.step:hover{border-color:#8dbf9d;box-shadow:0 2px 8px #173c3b22}
.step.done{background:#f1f9f2;border-color:#8dc79e}
.step.done .num{background:#2e9e5b;color:#fff}
.step.active{background:#d9ee9b;border-color:#8cb43a;box-shadow:0 2px 10px #8cb43a66;font-weight:600}
.step.active .num{background:#195658;color:#fff}
.steps .step.lock{opacity:.5}
.side-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:30;width:46px;height:46px;border-radius:50%;border:1px solid #ffffffaa;background:#ffffffe0;color:var(--teal);font-size:30px;line-height:1;padding:0 0 3px;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 16px #0006;transition:transform .15s,opacity .2s}
.side-nav.prev{left:10px}.side-nav.next{right:10px}
.side-nav:hover:not(:disabled){transform:translateY(-50%) scale(1.08)}
.side-nav:disabled{opacity:0;pointer-events:none}

.rail{display:none!important}
@media(max-width:640px){.side-nav{width:36px;height:36px;font-size:24px;opacity:.9}.side-nav.prev{left:4px}.side-nav.next{right:4px}}

/* ===== MÀN HÌNH MỞ ĐẦU ===== */
.intro-screen{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#0b4a4f;color:#fff;text-align:center;padding:28px;transition:opacity .45s ease,visibility .45s ease}
.intro-screen.leaving{opacity:0;visibility:hidden;pointer-events:none}
.intro-bg{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse at 50% 20%,#3f9a7e 0%,#1c6a62 45%,#0b4a4f 100%)}
.gcells{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1;opacity:.45}
.gcells i{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f0d9ffcc 0,#c58cf0cc 40%,#ff9a4aaa 75%,#7a2a9e55 100%);box-shadow:inset 0 0 14px #ffffff55;animation:gdrift ease-in-out infinite alternate}
@keyframes gdrift{to{transform:translate(var(--dx),var(--dy))}}
.intro-tint{position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(20,82,80,.78),rgba(25,96,90,.62) 50%,rgba(10,52,58,.86))}
.intro-inner{position:relative;z-index:4;width:min(100%,1200px);display:flex;flex-direction:column;align-items:center}
.intro-brand{display:flex;align-items:center;margin-bottom:14px}
.intro-brand .brand-logo{height:34px;width:auto;filter:brightness(0) invert(1)}
.intro-kicker{font-size:12px;letter-spacing:.18em;font-weight:900;color:#d4ef73;margin-bottom:12px}
.intro-inner h1{font-size:clamp(28px,4.2vw,56px);line-height:1.1;letter-spacing:-.03em;margin:0 0 14px;font-weight:900;max-width:1000px;text-shadow:0 4px 24px #0007}
.intro-inner h1 em{font-style:normal;color:#c7e85e}
.intro-inner p{max-width:720px;font-size:clamp(13px,1.3vw,17px);line-height:1.65;color:#e1efeb;margin:0;text-shadow:0 2px 10px #0008}
.intro-rule{width:min(470px,72vw);height:4px;border-radius:9px;background:#c7e85e;margin:18px 0 15px}
.intro-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 0 18px}
.intro-tags span{background:#ffffff1f;border:1px solid #ffffff4d;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:700;backdrop-filter:blur(4px)}
.intro-start{border:1px solid #ffffff70;background:#ffffff14;color:#fff;border-radius:13px;padding:13px 25px;font-weight:900;font-size:15px;min-width:205px;transition:.2s;backdrop-filter:blur(4px)}
.intro-start:hover{background:#c7e85e;color:#174d4b;border-color:#c7e85e}
.intro-start span{padding-left:10px;color:#c7e85e}
.intro-start:hover span{color:#174d4b}
.intro-inner>small{font-size:12px;color:#c1dcd4;margin-top:15px}

/* ===== THẺ BƯỚC + BẢNG CÁC BƯỚC (góc phải) ===== */
.stageTabs{position:absolute;right:14px;top:14px;z-index:14;display:grid;gap:8px;width:226px}
.stab{display:flex;align-items:center;gap:10px;border:2px solid transparent;background:#fff;color:#16423c;border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px;text-align:left;cursor:pointer;box-shadow:0 4px 12px #0003;transition:.15s}
.stab i{font-style:normal;flex:0 0 22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#e6efec;font-size:12px}
.stab:hover{transform:translateX(-2px)}
.stab.on{background:#d6f45a;border-color:#b5d63a}.stab.on i{background:#f0fbb0}
.stab.done i{background:#2e9d5b;color:#fff}
.stab.lock{opacity:.55;cursor:not-allowed}.stab.lock i{background:#e1e6e4;font-size:11px}
.card{position:absolute;right:14px;top:226px;z-index:12;width:226px;background:#ffffffef;backdrop-filter:blur(8px);border-radius:14px;padding:10px 12px 11px;box-shadow:0 14px 40px #0005;border:1px solid #ffffffaa;animation:floatIn .4s ease;max-height:calc(100% - 240px);overflow:auto}
.card .k{display:none;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.12em;font-weight:900;color:var(--teal2)}
.card .badge{margin-left:auto;letter-spacing:0;font-size:12.5px;font-weight:800;background:#e6f3e0;color:#2c6a1f;border-radius:999px;padding:4px 12px;white-space:nowrap}
.card h2{margin:0;font-size:14.5px;line-height:1.25;color:var(--teal)}
.card p{margin:0;display:none}
.csteps{display:flex;flex-direction:column;gap:7px;margin-top:9px}
.csteps:empty{display:none}
.csteps span{display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:9px;font-size:12.5px;font-weight:700;color:#7d918c;text-align:left;line-height:1.2}
.csteps span b{flex:0 0 24px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#e4eeec;color:#7d918c;font-size:12.5px}
.csteps span.on{color:var(--teal)}
.csteps span.on b{background:#ffd23f;color:#2b1d00;box-shadow:0 0 0 4px #ffd23f55}
.csteps span.done b{background:#2e9d5b;color:#fff}
.csteps span.done{color:#2e7d4b}
.csteps .vs{cursor:pointer;border-radius:8px;transition:background .15s}
.csteps .vs:hover{background:#eef6f3}
@media(min-width:761px){body.stg2 .card,body.stg3 .card{height:calc(100% - 242px);overflow-y:auto}}
.cguide{display:none}
@media(min-width:761px){
  .view.s1 ~ .s1-bottom,.view.s0 ~ .s1-bottom.hid{display:none}
  .cguide:not(:empty){display:grid;gap:9px;margin-top:11px;padding-top:11px;border-top:1.5px solid #dfeae6}
  .cguide .gi{display:flex;gap:9px;align-items:flex-start}
  .cguide .say{flex:0 0 30px;width:30px;height:30px;border-radius:50%;border:0;background:#1f5d5a;color:#fff;display:grid;place-items:center;cursor:pointer}
  .cguide .txt{font-size:13.5px;line-height:1.45;color:#16423c;font-weight:600}
  .cguide .gp .pill1{width:100%;justify-content:center;padding:8px 12px;font-size:13px;box-shadow:none;border:1.5px solid #c7e36e}
}

/* ===== THANH THÔNG TIN Ở CHÂN + NÚT ===== */
.s1-bottom{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 250px 16px 70px;background:linear-gradient(180deg,transparent,#021f2599);pointer-events:none}
.s1-bottom>*{pointer-events:auto}
.s1-info{display:flex;align-items:center;gap:12px;text-align:left;max-width:min(94%,820px);background:#fffffff7;color:#16423c;border:2px solid #c7e36e;border-radius:16px;padding:9px 16px;font-size:clamp(14px,1.1vw,16px);font-weight:500;line-height:1.5;box-shadow:0 8px 24px #0008;animation:floatIn .3s ease}
.s1-info b{color:var(--teal);font-weight:900}
.s1-info .txt{flex:1 1 auto}
.s1-info small{font-size:.88em;color:#4a6660}
.s1-info .say,.cguide .say{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:0;background:var(--teal);color:#fff;display:grid;place-items:center;box-shadow:0 3px 8px #0004;cursor:pointer}
.s1-info .say:hover{background:var(--teal2)}
.s1-info.ok{border-color:#2e9d5b;background:#f1fbf4}
.s1-info.no{border-color:#e0a21b;background:#fff8ea}
.s1-pills{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;align-items:center}
.s1-pills:empty{display:none}
.pill1{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#16423c;border:2px solid #c7e36e;border-radius:999px;padding:9px 18px;font-size:clamp(14px,1.1vw,16px);font-weight:800;box-shadow:0 5px 16px #0007;transition:transform .15s,background .2s;cursor:pointer}
.pill1 i{font-style:normal;font-weight:900;font-size:1.15em}
.pill1:hover{transform:translateY(-2px)}
.pill1.warm{background:#ffe9c7;border-color:#e0a21b;color:#5a3a00}
.pill1.on{background:#ffd23f;border-color:#fff;color:#2b1d00}
.pill1.go{background:#ffb627;border-color:#fff;color:#2b1d00;font-size:clamp(15px,1.2vw,17px);padding:10px 22px;animation:goPulse 1.6s ease-in-out infinite}
@keyframes goPulse{50%{box-shadow:0 0 0 8px #ffb62744,0 5px 16px #0005}}
.pill1[disabled]{opacity:.5;cursor:default;transform:none}
.toast{position:absolute;left:50%;top:70px;transform:translate(-50%,-10px);z-index:50;background:#0f3f3de8;color:#fff;font-size:16px;font-weight:600;padding:10px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:all .3s;max-width:86%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== BƯỚC 1: CHỌN DỤNG CỤ ===== */
#sceneA{display:grid;place-items:center;padding:20px 250px 130px 14px}
.tools{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;width:100%;max-width:1080px}
.tools .tool{flex:0 0 calc((100% - 48px)/5);min-width:0}
.tool{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:#ffffffee;border:2px solid #d6e7da;border-radius:16px;padding:10px 8px;box-shadow:0 5px 14px #0003;cursor:pointer;color:#16423c;transition:transform .15s,border-color .2s,background .2s}
.tool:hover{transform:translateY(-3px)}
.tool .ic{font-size:34px;line-height:1;height:40px;display:grid;place-items:center}
.tool .ic.pic{height:auto;display:block;width:100%}
.tool .ic.pic img{display:block;width:100%;height:auto;aspect-ratio:1/1;max-height:clamp(70px,15vh,130px);object-fit:contain;margin:0 auto;border-radius:12px;background:linear-gradient(160deg,#9fd0c6,#4f8d97)}
.tool b{font-size:clamp(12.5px,1.05vw,15px);font-weight:800;text-align:center;line-height:1.2}
.tool u{position:absolute;right:7px;top:6px;width:22px;height:22px;border-radius:50%;background:#2e9d5b;color:#fff;text-decoration:none;font-size:13px;font-weight:900;display:none;place-items:center}
.tool.got{border-color:#2e9d5b;background:#eefaf1}.tool.got u{display:grid}
.tool.bad{animation:shake .4s;border-color:#d24a3a;background:#fff1ef}
.tool.need{border-color:#ffb627;animation:toolNeed 1.5s ease-in-out infinite}
@keyframes toolNeed{0%,100%{box-shadow:0 0 0 0 #ffb62799,0 5px 14px #0003;background:#ffffffee}50%{box-shadow:0 0 0 7px #ffb62744,0 5px 14px #0003;background:#fff6d8}}
.tool.hl{border-color:#ffb627;background:#fffbea;animation:toolHl 1s ease-in-out infinite;z-index:2}
.tool.hl:after{content:"👆";position:absolute;right:6px;bottom:4px;font-size:30px;filter:drop-shadow(0 3px 4px #0008);animation:handTap 1s ease-in-out infinite}
@keyframes toolHl{0%,100%{box-shadow:0 0 0 0 #ffb62799,0 5px 14px #0003}50%{box-shadow:0 0 0 10px #ffb62733,0 8px 22px #0005;transform:scale(1.04)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ===== BƯỚC 2: BÀN THÍ NGHIỆM 3D ===== */
#sceneB{overflow:hidden}
#sceneB canvas{display:block}
.tbar{position:absolute;left:12px;top:12px;z-index:6;display:flex;gap:8px}
.tb{border:0;background:#e8f0ef;color:#16423c;border-radius:12px;padding:10px 15px;font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 2px 8px #0003;transition:.15s}
.tb:hover{background:#fff;transform:translateY(-1px)}
.tb.off{background:#cfe0de}
.rotHint{position:absolute;left:50%;transform:translateX(-50%);z-index:5;background:#0b2a2ccc;color:#fff;border:1px solid #ffffff55;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;white-space:nowrap;transition:opacity .6s;pointer-events:none}
.loading3{position:absolute;inset:0;z-index:8;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;background:#0f3a3acc}
.clock3{position:absolute;left:calc(50% - 120px);top:64px;transform:translateX(-50%);z-index:7;display:flex;align-items:center;gap:12px;background:#0b2a2ce8;color:#fff;border:2px solid #ffd23f;border-radius:20px;padding:8px 18px 8px 10px;box-shadow:0 8px 24px #0008;pointer-events:none;animation:floatIn .3s ease}
.clock3 svg{width:62px;height:62px;flex:0 0 auto}
.clock3 b{display:block;font-size:20px;font-weight:900;letter-spacing:.02em;white-space:nowrap}
.clock3 small{display:block;font-size:13px;color:#cfe6e0;font-weight:700;white-space:nowrap}
.clock3 .bar{height:6px;border-radius:9px;background:#ffffff2e;margin-top:5px;overflow:hidden}.clock3 .bar i{display:block;height:100%;width:0;background:#ffd23f}
#ln3{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
#ln3 line{stroke:#e6f27c;stroke-width:1.5;stroke-dasharray:4 3}
#ln3 circle{fill:#d4ef73;stroke:#16423c;stroke-width:1.5}
.n3{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;white-space:nowrap;pointer-events:none}
.n3.lf{flex-direction:row-reverse}
.n3 b{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:#d4ef73;color:#16423c;font-size:13px;font-weight:900;display:grid;place-items:center;box-shadow:0 0 0 2px #16423c66,0 3px 8px #0007}
.n3 span{font-size:clamp(11.5px,1vw,13.5px);font-weight:800;color:#fff;background:#0b2a2cd9;border:1px solid #ffffff38;border-radius:8px;padding:2px 9px}
.n3.on b{background:#ffd23f;box-shadow:0 0 0 4px #ffd23f66,0 3px 8px #0007}.n3.on span{border-color:#ffd23f;color:#ffe27a}
.hand3{position:absolute;left:0;top:0;z-index:6;pointer-events:none;width:34px;height:40px}
.hand3 span{position:absolute;left:0;top:6px;font-size:34px;line-height:1;filter:drop-shadow(0 3px 4px #000b);animation:handTap 1s ease-in-out infinite}
.hand3 i{position:absolute;left:3px;top:-6px;width:28px;height:28px;border-radius:50%;border:3px solid #ffd23f;opacity:0;animation:handRing 1s ease-out infinite}
@keyframes handTap{0%,100%{transform:translateY(8px) scale(1)}45%{transform:translateY(-2px) scale(.94)}55%{transform:translateY(-2px) scale(.94)}}
@keyframes handRing{0%,40%{opacity:0;transform:scale(.4)}55%{opacity:.95;transform:scale(.6)}100%{opacity:0;transform:scale(1.5)}}

/* ===== BƯỚC 3: QUAN SÁT KẾT QUẢ ===== */
#sceneC{overflow:hidden;background:#195658}
#obs{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#obs.dragging{cursor:grabbing}
.guide3{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;padding:70px 14px 110px;background:rgba(10,44,46,.86);backdrop-filter:blur(4px);animation:floatIn .4s ease}
.gbox{background:#fff;border-radius:20px;padding:18px 20px 16px;width:min(100%,560px);box-shadow:0 18px 50px #000a;max-height:100%;overflow:auto}
.gbox h4{margin:0 0 12px;font-size:clamp(17px,1.8vw,22px);color:var(--teal)}
.gbox ol{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:10px}
.gbox li{display:grid;grid-template-columns:42px 1fr;gap:10px;align-items:center;font-size:clamp(14px,1.2vw,16.5px);line-height:1.45;color:#2e4d48}
.gbox li i{font-style:normal;font-size:26px;width:42px;height:42px;border-radius:50%;background:#e6f3e0;display:grid;place-items:center}
.gbox .pill1{display:flex;margin:0 auto}
.obsInfo{position:absolute;left:14px;top:14px;z-index:6;width:min(360px,calc(100% - 270px));background:#ffffffee;border-radius:16px;padding:12px 14px;box-shadow:0 12px 32px #0004;font-size:14.5px;line-height:1.5;color:#2e4d48;animation:floatIn .3s ease}
.obsInfo{padding-right:52px}
.obsInfo .xbtn{position:absolute;top:10px;right:10px;width:32px;height:32px;border:none;border-radius:99px;background:#EEF3F2;color:#1d3b37;font-size:14px;line-height:1;cursor:pointer;display:grid;place-items:center}
.obsInfo .xbtn:hover{background:#DCE6E4}
.obsInfo h5{margin:0 0 4px;font-size:16px;color:var(--teal)}

/* ===== ÂM THANH (WebAudio) ===== */
function sfx(name,v=1){
  if(!S.narr) return;
  try{ const a=actx();
    switch(name){
      case 'clack': sfxTone(a,2300,'sine',.07,.09*v); sfxTone(a,3400,'sine',.05,.06*v,.008); break;
      case 'lid': sfxTone(a,1200,'triangle',.09,.09*v); sfxTone(a,820,'sine',.07,.05*v,.02); break;
      case 'strike': sfxNoise(a,'bandpass',3000,.25,.09*v); break;
      case 'ignite': sfxNoise(a,'lowpass',900,.5,.12*v,.14); break;
      case 'sizzle': sfxNoise(a,'highpass',4200,.6,.03*v,.06); break;
      case 'plop': sfxTone(a,520,'sine',.15,.12*v,0,150); sfxNoise(a,'lowpass',900,.1,.05*v,.003); break;
      case 'puff': sfxNoise(a,'lowpass',1500,.18,.1*v,.006); break;
      case 'tada': [523.25,659.25,783.99].forEach((f,i)=>sfxTone(a,f,'triangle',.34+(i===2?.25:0),.08*v,i*.13)); break;
    }
  }catch(e){}
}
/* tiếng lửa rì rì (fire) và nước reo / sôi (boil): hai dòng nhiễu liên tục, cường độ theo trạng thái cảnh */
const AMB={fire:null,boil:null,pop:0};
function ambMk(a,type,freq){ const s=a.createBufferSource(), fl=a.createBiquadFilter(), g=a.createGain(); s.buffer=noiseBuf(a); s.loop=true; fl.type=type; fl.frequency.value=freq; g.gain.value=.0001; s.connect(fl); fl.connect(g); g.connect(a.destination); s.start(); return {s,fl,g}; }
function ambSync(dt){
  const want=S.narr&&!document.hidden&&(S.stage===2||S.stage===3)&&B3.ready;
  const fire=want&&B3.lit?1:0, boil=want?clamp(B3.boil,0,1):0;
  if(!fire&&!boil&&!AMB.fire&&!AMB.boil) return;
  try{ const a=actx(), t=a.currentTime;
    if(fire&&!AMB.fire) AMB.fire=ambMk(a,'lowpass',400);
    if(boil&&!AMB.boil) AMB.boil=ambMk(a,'lowpass',700);
    if(AMB.fire) AMB.fire.g.gain.setTargetAtTime(fire?.05:.0001,t,.08);
    if(AMB.boil){ AMB.boil.g.gain.setTargetAtTime(boil>.02?.012+.05*boil:.0001,t,.15); AMB.boil.fl.frequency.setTargetAtTime(500+700*boil,t,.2);
      AMB.pop-=dt; if(boil>.3&&AMB.pop<=0){ sfxTone(a,260+Math.random()*420,'sine',.06,.025*boil,0,120+Math.random()*80); AMB.pop=(.05+Math.random()*.22)/boil; } }
  }catch(e){}
}

/* ===== MÔ HÌNH NHIỆT ỐNG NGHIỆM (xác định theo thời gian) ===== */
function cellModel(i,k,t){
  if(i===0){   /* ống (1): đun gần miệng; phần trên sôi ≈ 12 s, đáy gần như không nóng lên */
    if(k>=7){ const tb=11+.5*Math.abs(k-9), u=clamp(t/tb,0,1); return 25+75*(1-(1-u)*(1-u)); }
    return 25+(5+55*Math.exp(-(6-k)*.85))*Math.pow(t/HEAT_T,1.5);
  }
  /* ống (2): đun ở đáy; nóng gần như đồng đều, đáy hơn một chút */
  return 25+65*Math.pow(t/HEAT_T,.65)+3-6*(k/(TUBE.N-1));
}
const HEAT_STOPS=[[0,'#4aa8ff'],[.45,'#7fe0a0'],[.7,'#ffd23f'],[1,'#ff7a1a']];
const HEAT_COL=HEAT_STOPS.map(s=>[s[0],new THREE.Color(s[1])]);
function heatCol(T,out,lo=25,hi=100){ const x=clamp((T-lo)/(hi-lo),0,1); let i=0; while(i<HEAT_COL.length-2&&x>HEAT_COL[i+1][0]) i++; const a=HEAT_COL[i], b=HEAT_COL[i+1]; return out.copy(a[1]).lerp(b[1],clamp((x-a[0])/(b[0]-a[0]),0,1)); }
const rodBetween=(a,b,r,m)=>{ const d=b.clone().sub(a), len=d.length(), mesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,10),m); mesh.position.copy(a).addScaledVector(d,.5); mesh.quaternion.setFromUnitVectors(V3(0,1,0),d.normalize()); return mesh; };
const tubePt=(tb,s,off)=>tb.g.localToWorld(V3(0,s,0)).add(off||V3(0,0,0));

const softTex=(()=>{ let t=null; return ()=>{ if(t) return t; const c=document.createElement('canvas'); c.width=c.height=64; const x=c.getContext('2d'), g=x.createRadialGradient(32,32,1,32,32,32); g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.45,'rgba(255,255,255,.5)'); g.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle=g; x.fillRect(0,0,64,64); return t=new THREE.CanvasTexture(c); }; })();

const waterM=(c,op)=>new THREE.MeshStandardMaterial({color:c,transparent:true,opacity:op,roughness:.35,metalness:0,envMapIntensity:.22,depthWrite:false});
/* nước trong ống nghiệm: 12 đoạn trụ nối tiếp (mỗi đoạn một ô nhiệt), cắt bằng mặt phẳng ngang nên mặt nước luôn nằm ngang */
function mkTubeWater(tb){
  const g=tb.g, W=new THREE.Group(); tb.plane=new THREE.Plane(V3(0,-1,0),100); tb.mats=[]; const rw=TUBE.rw;
  for(let k=0;k<TUBE.N;k++){
    const m=waterM(0x8ccbf0,.55); m.side=THREE.DoubleSide; m.clippingPlanes=[tb.plane]; tb.mats.push(m);
    const mesh=new THREE.Mesh(new THREE.CylinderGeometry(rw,rw,TUBE.seg+.01,22,1,true),m); mesh.position.y=TUBE.s0+(k+.5)*TUBE.seg; mesh.renderOrder=4; mesh.userData.noGlow=true; mesh.userData.noPick=true; W.add(mesh);
    if(k===0){ const hs=new THREE.Mesh(new THREE.SphereGeometry(rw,22,12,0,Math.PI*2,Math.PI/2,Math.PI/2),m); hs.position.y=TUBE.s0; hs.renderOrder=4; hs.userData.noGlow=true; hs.userData.noPick=true; W.add(hs); }
  }
  g.add(W); tb.W=W;
  const sm=waterM(0x8ccbf0,.6); sm.side=THREE.DoubleSide; tb.surfM=sm;
  const sf=new THREE.Mesh(new THREE.CircleGeometry(rw,28).rotateX(-Math.PI/2),sm); sf.renderOrder=5; sf.visible=false; sf.userData.noGlow=true; sf.userData.noPick=true; (B3.zg?B3.zg[0]:B3.sc).add(sf); tb.surf=sf;
  /* bọt khí (con của ống, bị cắt theo mặt nước), hơi nước (trong cảnh), vệt đối lưu mờ (ống 2) */
  tb.bub=[]; for(let n=0;n<14;n++){ const m=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.7,depthWrite:false}); m.clippingPlanes=[tb.plane]; const b=new THREE.Mesh(new THREE.SphereGeometry(.07+Math.random()*.07,8,6),m); b.visible=false; b.renderOrder=7; b.userData.noPick=true; g.add(b); tb.bub.push({m:b,a:Math.random()*6.28,r:Math.random()*(rw-.15),h:Math.random(),sp:.5+Math.random()*.8}); }
  tb.steam=[]; for(let n=0;n<7;n++){ const s=new THREE.Sprite(new THREE.SpriteMaterial({map:softTex(),transparent:true,opacity:0,depthWrite:false,color:0xeaf6ff})); s.visible=false; s.renderOrder=9; B3.sc.add(s); tb.steam.push({s,h:n/7,a:Math.random()*6.28,sp:.35+Math.random()*.3}); }
  { const NS=14, geo=new THREE.BufferGeometry(), pa=new Float32Array(NS*3); geo.setAttribute('position',new THREE.BufferAttribute(pa,3));
    const pm=new THREE.PointsMaterial({size:.55,map:softTex(),color:0xffffff,transparent:true,opacity:0,depthWrite:false,sizeAttenuation:true}); pm.clippingPlanes=[tb.plane];
    const pts=new THREE.Points(geo,pm); pts.frustumCulled=false; pts.renderOrder=7; pts.visible=false; g.add(pts);
    tb.stk={pts,pa,p:Array.from({length:NS},(_,n)=>{ const center=n%2===0; return {c:center,a:Math.random()*6.28,r:center?Math.random()*.25:rw*(.62+Math.random()*.25),s:Math.random()*TUBE.sw,v:.9+Math.random()*.7}; })}; }
}

function buildScene3D(){
  const sc=B3.sc, M=stdM, shTex=blobTexture();

  const blob=(x,z,r,o=1)=>{ const m=new THREE.Mesh(new THREE.PlaneGeometry(r*2,r*2),new THREE.MeshBasicMaterial({map:shTex,transparent:true,opacity:o,depthWrite:false})); m.rotation.x=-Math.PI/2; m.position.set(x,.24,z); m.renderOrder=1; sc.add(m); return m; };
  /* bàn thí nghiệm */
  addTo(sc,new THREE.Mesh(new THREE.BoxGeometry(222,5,170),M(0xeef2ea,{roughness:.75})),-8,-2.5,0);
  addTo(sc,new THREE.Mesh(new THREE.BoxGeometry(222,5.2,.8),M(0xaebfb2,{roughness:.6})),-8,-2.6,85.1);
  addTo(sc,new THREE.Mesh(new THREE.BoxGeometry(222,.12,.5),M(0xffffff,{roughness:.4})),-8,.04,84.2);
  /* hai khu: mỗi khu một nhóm để làm mờ khi không dùng */
  const zg=B3.zg=[new THREE.Group(),new THREE.Group()]; zg.forEach(g=>sc.add(g)); B3.zd=[0,0];
  /* khay đựng dụng cụ */
  const mkTray=(sc,tx,tz,tw,td)=>{ const tm=M(0xffffff,{map:woodTexture(),roughness:.6}), rm=M(0x9a8a7e,{map:woodTexture(),roughness:.6});
    addTo(sc,new THREE.Mesh(new THREE.BoxGeometry(tw,.2,td),tm),tx,.1,tz);
    addTo(sc,new THREE.Mesh(new THREE.BoxGeometry(tw+.8,1.2,.8),rm),tx,.6,tz-td/2); addTo(sc,new THREE.Mesh(new THREE.BoxGeometry(tw+.8,1.2,.8),rm),tx,.6,tz+td/2);

  mkTray(zg[0],-70,30,70,32);   /* khay 1: ống (1), ống (2), bật lửa, đèn A, đèn B */
  mkTray(zg[1],62,30,56,32);    /* khay 2: bật lửa, đèn C, gói thuốc tím */
  const metal=M(0xc5ccd1,{metalness:.75,roughness:.28}), metal2=M(0xc5ccd1,{metalness:.75,roughness:.28});
  /* viền khu vẽ trên mặt bàn */
  { const rr=(C,x0,y0,x1,y1,r)=>{ const s=new C(); s.moveTo(x0+r,y0); s.lineTo(x1-r,y0); s.absarc(x1-r,y0+r,r,-Math.PI/2,0,false); s.lineTo(x1,y1-r); s.absarc(x1-r,y1-r,r,0,Math.PI/2,false); s.lineTo(x0+r,y1); s.absarc(x0+r,y1-r,r,Math.PI/2,Math.PI,false); s.lineTo(x0,y0+r); s.absarc(x0+r,y0+r,r,Math.PI,Math.PI*1.5,false); return s; };
    const basic=(c,o)=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2});
    const frame=(Z,col,parent)=>{ const sh=rr(THREE.Shape,Z.x0,-Z.z1,Z.x1,-Z.z0,6); sh.holes.push(rr(THREE.Path,Z.x0+.6,-Z.z1+.6,Z.x1-.6,-Z.z0-.6,5.4)); const m=new THREE.Mesh(new THREE.ShapeGeometry(sh,12).rotateX(-Math.PI/2),basic(col,.55)); m.position.y=.05; m.renderOrder=1; m.userData.noPick=true; m.userData.noGlow=true; parent.add(m); };
    frame(ZONE.z1,0x4aa8ff,zg[0]); frame(ZONE.z2,0x8e3fbf,zg[1]);
  }

  /* ===== đèn cồn ===== */
  const LM0=MD.lamp||fallbackModel('lamp'); B3.lidY=LM0.lidY;
  const clObj=o=>{ const c=o.clone(true); c.traverse(m=>{ if(m.isMesh&&m.material) m.material=m.material.clone(); }); return c; };
  B3.lamps=POS.lamps.map((P,i)=>{ const LM=i===0?LM0:(MD.lamp?{body:clObj(MD.lamp.body),lid:MD.lamp.lid?clObj(MD.lamp.lid):null}:fallbackModel('lamp'));
    const g=new THREE.Group(); g.position.copy(P); g.add(LM.body); zg[i===2?1:0].add(g); g.userData.rest=P.clone();
    const lid=LM.lid||fallbackModel('lamp').lid; lid.userData.isLid=true; g.add(lid); lid.position.set(0,B3.lidY,0);
    const sh=blob(P.x,P.z,9,.75), shL=blob(0,0,3.6,.6); shL.visible=false; return {g,lid,sh,shL}; });
  B3.act=-1; setActiveLamp(0);



  /* ngọn lửa đèn cồn: 3 lớp lưới bán trong suốt + shader procedural (noise uốn, gradient màu theo chiều cao, mép mềm theo góc nhìn) */
  const FV=`uniform float uTime,uH,uAmp,uSeed,uSpeed; varying float vH; varying vec3 vN; varying vec3 vV; varying vec2 vXZ;
  void main(){ vec3 p=position; float h=clamp(p.y/uH,0.,1.); float t=uTime*uSpeed; float h2=h*h;
    float sx=sin(t*2.3+h*3.5+uSeed)+.55*sin(t*4.1-h*6.+uSeed*1.7)+.3*sin(t*7.3+h*9.+uSeed*.6);
    float sz=cos(t*1.9+h*3.+uSeed*1.3)+.5*sin(t*3.7-h*5.+uSeed);
    p.y*=1.+.06*h*sin(t*5.+uSeed*2.);
    p.x+=sx*uAmp*h2; p.z+=sz*uAmp*h2*.7;
    p.xz*=1.+.09*h*sin(t*6.-h*10.+atan(p.z,p.x)*2.+uSeed);
    vec4 mv=modelViewMatrix*vec4(p,1.); vN=normalize(normalMatrix*normal); vV=normalize(-mv.xyz); vH=h; vXZ=p.xz; gl_Position=projectionMatrix*mv; }`;
  const FF=`uniform float uTime,uCore,uAlpha,uSpeed; varying float vH; varying vec3 vN; varying vec3 vV; varying vec2 vXZ;
  void main(){ float h=vH; float rim=1.-abs(dot(normalize(vN),normalize(vV))); float edge=1.-smoothstep(.2,1.,rim);
    vec3 cBlue=vec3(.212,.561,1.), cCore=vec3(.84,.93,1.), cYel=vec3(1.,.89,.42), cOr=vec3(1.,.678,.212), cTip=vec3(1.,.8,.58);
    vec3 c=cBlue; c=mix(c,cYel,smoothstep(.1,.38,h)); c=mix(c,cOr,smoothstep(.45,.8,h)); c=mix(c,cTip,smoothstep(.8,1.,h)); c=mix(c,cCore,uCore*(1.-smoothstep(0.,.7,h)));
    float ang=atan(vXZ.y,vXZ.x); float st=.88+.12*sin(h*16.-uTime*7.*uSpeed+ang*3.);
    float a=uAlpha*edge*st*smoothstep(0.,.05,h)*(1.-smoothstep(.5,1.,h));
    gl_FragColor=vec4(c*(1.+.35*(1.-h)*uCore),a); }`;
  const FLAME_U=B3.flameU={uTime:{value:0}};
  const mkFlame=(fh)=>{ const g=new THREE.Group(), R=fh*.2;
    [{w:1,h:1,core:0,alpha:.55,amp:.5,seed:0,speed:1},{w:.72,h:.82,core:.4,alpha:.7,amp:.38,seed:2.1,speed:1.35},{w:.42,h:.55,core:1,alpha:.9,amp:.22,seed:4.3,speed:1.7}].forEach(Ly=>{
      const H=fh*Ly.h, pts=[]; for(let k=0;k<=22;k++){ const h=k/22; pts.push(new THREE.Vector2(k===22?.001:R*Ly.w*Math.max(.16,Math.pow(Math.sin(Math.PI*Math.pow(h,.62)),.85))*(1-.35*h),h*H)); }
      const mat=new THREE.ShaderMaterial({uniforms:{uTime:FLAME_U.uTime,uH:{value:H},uAmp:{value:R*Ly.amp*2.2},uSeed:{value:Ly.seed},uCore:{value:Ly.core},uAlpha:{value:Ly.alpha},uSpeed:{value:Ly.speed}},vertexShader:FV,fragmentShader:FF,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide});
      const m=new THREE.Mesh(new THREE.LatheGeometry(pts,28),mat); m.renderOrder=10; m.userData.noPick=true; m.userData.noGlow=true; g.add(m); });
    return g; };
  const fl=B3.flame=mkFlame(FH); fl.visible=false; sc.add(fl); B3.flameS=0;
  B3.flameLight=new THREE.PointLight(0xffa040,0,40,1.6); sc.add(B3.flameLight);
  { const cv=document.createElement('canvas'); cv.width=cv.height=64; const x=cv.getContext('2d'), g=x.createRadialGradient(32,32,2,32,32,32); g.addColorStop(0,'rgba(255,220,180,.55)'); g.addColorStop(1,'rgba(255,220,180,0)'); x.fillStyle=g; x.fillRect(0,0,64,64); const tx=new THREE.CanvasTexture(cv);
    B3.gas=[]; for(let i=0;i<7;i++){ const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,transparent:true,opacity:0,depthWrite:false})); s.visible=false; s.renderOrder=9; sc.add(s); B3.gas.push({s,h:i/7,a:Math.random()*6.28,sp:.35+Math.random()*.3}); } }

  /* ===== 3 giá đỡ: giá ống (1), giá ống (2), giá đỡ cốc (vòng đỡ + lưới đun) ===== */
  B3.stands=[]; [RG.t[0].pole,RG.t[1].pole,RG.bk.pole].forEach((p,i)=>{ const st=new THREE.Group(); st.position.copy(p); st.add(MD.stand?cloneModel('stand'):fallbackModel('stand')); zg[i===2?1:0].add(st); B3.stands.push(st); blob(p.x+3,p.z,20,.7); });
  RG.t.forEach(r=>{
    const ring=new THREE.Mesh(new THREE.TorusGeometry(TUBE.ro+.22,.22,10,28),metal); ring.position.copy(r.C); ring.quaternion.setFromUnitVectors(V3(0,0,1),AX); zg[0].add(ring);
    const e=V3(1,0,0).addScaledVector(AX,-AX.x).normalize(), edge=r.C.clone().addScaledVector(e,TUBE.ro+.22);
    zg[0].add(rodBetween(V3(r.pole.x,edge.y,r.pole.z),edge,.3,metal)); addTo(zg[0],new THREE.Mesh(new THREE.BoxGeometry(2,2.2,2.6),metal),r.pole.x,edge.y,r.pole.z); });
  { const c=RG.bk, Rr=4.4, ring=new THREE.Mesh(new THREE.TorusGeometry(Rr,.32,10,40),metal2); ring.rotation.x=Math.PI/2; ring.position.set(c.cx,c.yG-.5,c.cz); zg[1].add(ring);
    addTo(zg[1],new THREE.Mesh(new THREE.BoxGeometry(9.6,.22,9.6),new THREE.MeshStandardMaterial({map:gauzeTexture(),roughness:.8,metalness:.2})),c.cx,c.yG-.1,c.cz);
    zg[1].add(rodBetween(V3(c.pole.x,c.yG-.5,c.pole.z),V3(c.cx+Rr,c.yG-.5,c.cz),.3,metal2)); addTo(zg[1],new THREE.Mesh(new THREE.BoxGeometry(2,2.2,2.6),metal2),c.pole.x,c.yG-.5,c.pole.z); }

  /* ===== 2 ống nghiệm ===== */
  TB.length=0;
  [0,1].forEach(i=>{ const g=new THREE.Group(); g.add(MD.tube?cloneModel('tube'):fallbackModel('tube')); zg[0].add(g); g.userData.rest=POS.tube[i].clone();
    const tb={i,g,st:'tray',c:new Float32Array(TUBE.N).fill(25),melt:0,waxCell:cellOf(TUBE.sWax[i]),boil:0,waxM:-1,sh:blob(0,0,1,.5)}; tb.sh.scale.set(8,2,1); TB.push(tb); mkTubeWater(tb); });

  /* ===== cốc nước + nhiệt kế + hạt thuốc tím ===== */
  buildCup(blob);

  /* ===== gói thuốc tím ===== */
  { const g=B3.dye=new THREE.Group(), core=new THREE.Mesh(new THREE.BoxGeometry(2,.8,2),M(0x8e3fbf,{roughness:.5,emissive:0x2a0a40,emissiveIntensity:.35})), wrap=new THREE.Mesh(new THREE.BoxGeometry(2.5,1.1,2.5),new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.6,roughness:.9,depthWrite:false}));
    wrap.renderOrder=8; g.add(core); g.add(wrap); g.position.copy(POS.dye); g.scale.setScalar(DYE_S); g.userData.rest=POS.dye.clone(); zg[1].add(g); B3.shDye=blob(POS.dye.x,POS.dye.z,4.4,.6);
    const dish=new THREE.Mesh(new THREE.CylinderGeometry(4.6,4.2,.25,32),M(0xffffff,{roughness:.35})); dish.userData.noPick=true; addTo(zg[1],dish,POS.dye.x,.2+.125,POS.dye.z); }

  /* ===== bật lửa ===== */
  B3.lighters=POS.lighters.map((P,i)=>{ const lm=i===0?(MD.lighter||fallbackModel('lighter')):(MD.lighter?clObj(MD.lighter):fallbackModel('lighter')); const lt=new THREE.Group(); lt.add(lm); lt.position.copy(P); lt.userData.rest=P.clone(); lt.userData.tip=(MD.lighter&&MD.lighter.userData.tip?MD.lighter.userData.tip.clone():(lm.userData.tip&&lm.userData.tip.clone?lm.userData.tip.clone():V3(0,8,0))); zg[i].add(lt);
    const sh=blob(P.x,P.z,4.5,.7), f=mkFlame(3.2); f.scale.setScalar(.35); f.position.copy(lt.userData.tip); f.visible=false; lt.add(f); return {g:lt,sh,fl:f}; });

  /* ===== bóng mờ của đèn cồn ở hai vị trí đun (bước dự đoán) ===== */
  B3.ghosts=[RG.t[0].near,RG.t[1].bot].map(p=>{ const o=(MD.lamp?MD.lamp.body:fallbackModel('lamp').body).clone(true); o.traverse(m=>{ if(m.isMesh){ m.material=m.material.clone(); m.material.transparent=true; m.material.opacity=.34; m.material.depthWrite=false; m.userData.noPick=true; } }); o.position.copy(p); o.visible=false; sc.add(o); return o; });

  /* ánh sáng */
  B3.lights=[new THREE.HemisphereLight(0xffffff,0x3a5a60,.9),new THREE.DirectionalLight(0xffffff,1.7),new THREE.DirectionalLight(0xbfe9ff,.6)];
  B3.lights[1].position.set(-30,60,50); B3.lights[2].position.set(40,20,-30); B3.lights.forEach(l=>{ l.userData.i0=l.intensity; sc.add(l); });
  initDomPins(); makeProxies(); B3.ready=true; applyMode(modeFor(S.stage),true);
}
const modeFor=i=>['tray','preview','exp1','exp2','none'][i]||'tray';

/* ===== cốc nước: nước (màu thường + ảnh nhiệt), nhiệt kế, hạt thuốc tím ===== */
function buildCup(blob){
  const sc=B3.sc, c=RG.bk, g=B3.cupG=new THREE.Group(); g.position.set(c.cx,c.y0,c.cz); B3.zg[1].add(g); g.userData.rest=g.position.clone();
  g.add(MD.beaker?cloneModel('beaker'):fallbackModel('beaker'));
  const Rw=BK.Rw, Hw=BK.y1-BK.y0, y0=BK.y0;
  const wg=new THREE.CylinderGeometry(Rw,Rw,Hw,40,14,true); wg.translate(0,y0+Hw/2,0);
  const water=new THREE.Mesh(wg,waterM(0x8ccbf0,.45)); water.renderOrder=4; water.userData.noGlow=true; water.userData.noPick=true; g.add(water);

function gotoStage(i){
  i=clamp(i,0,STAGES.length-1);

  if(S.active&&i!==S.stage) visited.add(S.stage);
  stopSpeak(); S.stage=i; S.lastSay=null; S.lastVk=null; lastKey='';
  if(S.micro) closeMicro(true);
  { const m=modeFor(i); if(B3.ready){ if(B3.mode!==m) applyMode(m); } else B3.mode=m; }
  { const lb=$id('lbl3'); if(lb){ lb.classList.toggle('numonly',i===0); L3.forEach(l=>l.w=0); } const tp=$id('ttip'); if(tp) tp.hidden=true; B3.tipId=null; B3.hintId=null; if(B3.zoomId) zoomOut();

  B3.thermal=false;
  showScene(i);
  renderSteps(); render();
  if(i===1) speakOnce('dd');
  if(i===2) speakOnce('o1');
  if(i===3) speakOnce('tt');

}
const sayKey=()=>S.micro?'vm':S.stage===0?'dc':S.stage===1?'dd':S.stage===4?'kl':S.stage===2?(prepDone>=6?'kq1':prepDone>=3?'o2':'o1'):(S.ringDone?'dl':prepDone>=3?'vm':'tt');
document.addEventListener('click',e=>{

  const b=e.target.closest('button[data-act]'); if(!b||b.disabled) return;

  switch(a){
    case 'say': { const k=sayKey(); speak(VTEXT[k],true,k); break; }

    case 'hint0': { const l=L3.find(x=>!tray[x.id]); if(l){ B3.hintId=l.id; toast('Hãy bấm vào số '+l.n+' trên bàn thí nghiệm.'); clearTimeout(hint0T); hint0T=setTimeout(()=>{ B3.hintId=null; },3500); } break; }
    case 'hint3d': B3.hintT=performance.now()+3500; toast('Gợi ý: '+String(curPhase()?curPhase()[2]:'').replace(/<[^>]+>/g,'')); break;
    case 'pred': S.predict=b.dataset.i; S.ok[1]=true; beep(true); lastKey=''; render(); break;

    case 'quick': quickDo(); break;
    case 'micro': openMicro(); break;
    case 'micGo': micStart(); break;
    case 'micCmp': MIC.cmp=!MIC.cmp; b.textContent=MIC.cmp?'↔ Xem lại một khung':'↔ So sánh với chất rắn'; if(MIC.cmp){ S.mic.solid=true; beep(true); } micUpdate(); break;
    case 'closeMicro': { if(curPrepKey()==='micro'){ S.mic.hot=true; S.mic.cold=true; clearTimeout(micUpdate._t); sfx('tada',.6); finishStep('Đã quan sát xong các hạt nước.'); } closeMicro(); break; }
    case 'restart': { Object.keys(tray).forEach(k=>delete tray[k]); lastPick=null; S.predict=null; S.played={mo:true}; S.t1={melt2:null}; S.mic={hot:false,cold:false,solid:false}; S.microSeen=false; S.ringDone=false; S.ok=[false,false,false,false,false]; visited.clear(); L3.forEach(l=>l.el&&l.el.classList.remove('got')); if(B3.ready) applyMode('tray'); else B3.mode='tray'; gotoStage(0); break; }
    case 'review': gotoStage(3); break;
  }
});
